framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 3
                    max_delay: 60000

            outbox:
                dsn: 'doctrine://default?queue_name=outbox'
                options:
                    auto_setup: false
                retry_strategy:
                    max_retries: 5
                    delay: 2000
                    multiplier: 2

            broker:
                dsn: '%env(BROKER_TRANSPORT_DSN)%'

            failed:
                dsn: 'doctrine://default?queue_name=failed'
                options:
                    auto_setup: false

        routing:
            App\Message\IngestUsageMessage: async
            App\Message\IngestUsageBatchMessage: async
            App\Message\CredentialsStateChanged: outbox
            App\Message\QuotaThresholdReached: outbox
            App\Message\ProxyFleetNotification: broker
            App\Message\QuotaThresholdNotification: broker

when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
                outbox: 'in-memory://'
                broker: 'in-memory://'
                failed: 'in-memory://'
